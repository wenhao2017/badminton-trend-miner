map $request_method $badminton_login_ip {
    default "";
    POST $binary_remote_addr;
}

map $request_method $badminton_login_global {
    default "";
    POST badminton;
}

limit_req_zone $badminton_login_ip zone=badminton_login_ip:1m rate=6r/m;
limit_req_zone $badminton_login_global zone=badminton_login_global:1m rate=30r/m;
