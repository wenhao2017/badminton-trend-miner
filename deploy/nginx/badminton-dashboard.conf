server {
    listen 80 default_server;
    server_name 23.95.43.88;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/badminton-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://23.95.43.88$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name 23.95.43.88;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/badminton-dashboard-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/badminton-dashboard-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:badminton_tls:1m;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host 23.95.43.88;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";

    location = /login {
        client_max_body_size 16k;
        limit_req zone=badminton_login_ip burst=4 nodelay;
        limit_req zone=badminton_login_global burst=12 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8010;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
    }
}
