name: badminton-trend-miner
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8010:8000"
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////workspace/data/badminton.sqlite3
    volumes:
      - badminton_data:/workspace/data
      - badminton_models:/workspace/models
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  badminton_data:
  badminton_models:

